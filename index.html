<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreatorHub</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #F5F1EC; }
    #gas-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: none; display: none; z-index: 9999; }
    #login-screen { display: flex; width: 100vw; height: 100vh; z-index: 1; }
    .login-left {
      flex: 0 0 52%; background: #000;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 2.5rem 3rem; position: relative; overflow: hidden;
    }
    .login-left::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 28px 28px; pointer-events: none;
    }
    .login-left::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 180px;
      background: linear-gradient(to top, #000, transparent); pointer-events: none;
    }
    .login-right {
      flex: 1; background: #F5F1EC;
      display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .login-card {
      background: #fff; border: 1px solid #E7E2D2; border-radius: 18px;
      padding: 2.5rem 2.25rem 2rem;
      box-shadow: 0 2px 8px rgba(40,36,28,.05), 0 8px 32px rgba(40,36,28,.07);
      width: 100%; max-width: 380px;
    }
    .stat-card {
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px; padding: .85rem 1.25rem; min-width: 110px;
    }
    @keyframes shimmer { 0%,100%{opacity:.4} 50%{opacity:1} }
    .stat-loading { animation: shimmer 1.4s ease-in-out infinite; }
    #signin-btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: .65rem;
      padding: .8rem 1.25rem; background: #fff; border: 1.5px solid #E7E2D2;
      border-radius: 10px; font-size: .9rem; font-weight: 600; color: #161513;
      cursor: pointer; transition: all .15s; font-family: 'Inter', sans-serif;
    }
    #signin-btn:hover:not(:disabled) { border-color: #C9C2AE; box-shadow: 0 3px 12px rgba(40,36,28,.1); }
    #signin-btn:disabled { opacity: .55; cursor: not-allowed; }
    #error-box { display: none; margin-top: .9rem; padding: .75rem 1rem; background: #FDECEA; border: 1px solid #f5c6c2; border-radius: 8px; font-size: .83rem; color: #C0392B; }
    #error-box.show { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 16px; height: 16px; border: 2px solid #E7E2D2; border-top-color: #161513; border-radius: 50%; animation: spin .7s linear infinite; }
    @media (max-width: 767px) {
      #login-screen { flex-direction: column; }
      .login-left { flex: 0 0 auto; padding: 2rem 1.5rem; min-height: 260px; }
    }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-left">
      <div style="display:flex;align-items:center;gap:.75rem;position:relative;z-index:1;">
        <div style="width:36px;height:36px;background:#F0C61E;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.9rem;color:#161513;">SA</div>
        <span style="color:rgba(255,255,255,.45);font-size:.8rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;">SAADAA · INTERNAL</span>
      </div>
      <div style="position:relative;z-index:1;">
        <div style="margin-bottom:1.1rem;">
          <span style="display:inline-flex;align-items:center;gap:.4rem;background:rgba(240,198,30,.1);border:1px solid rgba(240,198,30,.22);color:#F0C61E;font-size:.69rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;padding:.28rem .7rem;border-radius:100px;">
            <span style="width:5px;height:5px;background:#F0C61E;border-radius:50%;"></span>
            Influencer Management
          </span>
        </div>
        <h1 style="font-family:'Space Grotesk',sans-serif;font-size:clamp(2.4rem,3.8vw,3.2rem);font-weight:700;color:#fff;line-height:1.12;margin:0 0 1rem;letter-spacing:-1.5px;">CreatorHub</h1>
        <p style="font-size:.95rem;color:rgba(255,255,255,.38);line-height:1.65;max-width:320px;">One source of truth for every creator, campaign, and collab.</p>
      </div>
      <div style="position:relative;z-index:1;">
        <div style="display:flex;gap:.65rem;flex-wrap:wrap;margin-bottom:1.75rem;">
          <div class="stat-card"><div style="font-size:.63rem;color:rgba(255,255,255,.35);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.4rem;">CREATORS</div><div id="stat-creators" class="stat-loading" style="font-size:1.5rem;font-weight:700;color:#fff;font-family:'Space Grotesk',sans-serif;">—</div></div>
          <div class="stat-card"><div style="font-size:.63rem;color:rgba(255,255,255,.35);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.4rem;">CAMPAIGNS</div><div id="stat-campaigns" class="stat-loading" style="font-size:1.5rem;font-weight:700;color:#fff;font-family:'Space Grotesk',sans-serif;">—</div></div>
          <div class="stat-card"><div style="font-size:.63rem;color:rgba(255,255,255,.35);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.4rem;">POSTS</div><div id="stat-posts" class="stat-loading" style="font-size:1.5rem;font-weight:700;color:#fff;font-family:'Space Grotesk',sans-serif;">—</div></div>
        </div>
        <div style="font-size:.69rem;color:rgba(255,255,255,.18);">v3.0 · Google OAuth · Supabase</div>
      </div>
    </div>
    <div class="login-right">
      <div class="login-card">
        <div style="margin-bottom:2rem;">
          <p style="font-size:.69rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#9A9384;margin:0 0 .5rem;">SIGN IN</p>
          <h2 style="font-family:'Space Grotesk',sans-serif;font-size:1.7rem;font-weight:700;color:#161513;margin:0 0 .45rem;">Welcome back</h2>
          <p style="font-size:.865rem;color:#6E695E;">Use your <strong style="color:#161513;font-weight:600;">@saadaa.in</strong> Google account.</p>
        </div>
        <button id="signin-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
          <span id="btn-label">Continue with Google</span>
        </button>
        <div id="error-box"></div>
        <div style="margin-top:2rem;padding-top:1.25rem;border-top:1px solid #F0EAD6;display:flex;justify-content:space-between;">
          <span style="font-size:.69rem;color:#B5AFA5;">SSO via Google Workspace</span>
          <span style="font-size:.69rem;color:#B5AFA5;">v3.0</span>
        </div>
      </div>
    </div>
  </div>
  <iframe id="gas-frame" allowfullscreen="true"></iframe>
  <script>
    var SB_URL = 'https://xynyvbagcudjrzklwnqp.supabase.co';
    var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5bnl2YmFnY3VkanJ6a2x3bnFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMjY4MjcsImV4cCI6MjA5MzkwMjgyN30.1Yuf1xytcp_tGWnkCVEQZU6DixQJgnIZJP2q9P8r8NU';
    var REDIRECT = 'https://saadaa-sustainable.github.io/Influencer-Workflow-Optimizer/';
    var GAS_BASE = 'https://script.google.com/macros/s/AKfycbwCOkaGFOzBAd9Bki58RNk9_qPmmpGrNCJMteknBt3dEcDzeba8LDXP1NR0h7irJFvF/exec';
    var SESSION_KEY = 'ch_auth_v3';
    var sb = supabase.createClient(SB_URL, SB_ANON, { auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: true } });

    // Stats
    fetch(SB_URL + '/rest/v1/rpc/get_login_stats', { method: 'POST', headers: { 'apikey': SB_ANON, 'Content-Type': 'application/json' }, body: '{}' })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d && d.creators !== undefined) {
          ['creators', 'campaigns', 'posts'].forEach(function(k) {
            var el = document.getElementById('stat-' + k);
            el.classList.remove('stat-loading');
            el.textContent = Number(d[k] || 0).toLocaleString();
          });
        }
      }).catch(function() {});

    function showError(msg) { var e = document.getElementById('error-box'); e.textContent = msg; e.classList.add('show'); }
    function hideError() { document.getElementById('error-box').classList.remove('show'); }
    function setLoading(on) {
      var btn = document.getElementById('signin-btn');
      btn.disabled = on;
      document.getElementById('btn-label').textContent = on ? 'Signing in...' : 'Continue with Google';
    }

    function launchApp(email, role) {
      console.log('[CreatorHub] launchApp called:', email, role);
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({ email: email, role: role }));

      var loginScreen = document.getElementById('login-screen');
      var frame = document.getElementById('gas-frame');

      console.log('[CreatorHub] Before - loginScreen display:', loginScreen.style.display, 'frame display:', frame.style.display);

      // Force hide login with !important
      loginScreen.style.cssText = 'display: none !important;';

      // Set iframe src and show it
      frame.src = GAS_BASE + '?email=' + encodeURIComponent(email) + '&role=' + encodeURIComponent(role);
      frame.style.cssText = 'position: fixed; inset: 0; width: 100%; height: 100%; border: none; display: block !important; z-index: 9999;';

      console.log('[CreatorHub] After - loginScreen display:', loginScreen.style.display, 'frame display:', frame.style.display);
      console.log('[CreatorHub] loginScreen offsetHeight:', loginScreen.offsetHeight, 'frame offsetHeight:', frame.offsetHeight);
    }

    function verifyAndLaunch(email) {
      setLoading(true);
      fetch(SB_URL + '/rest/v1/rpc/get_user_access', {
        method: 'POST',
        headers: { 'apikey': SB_ANON, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_email: email })
      })
      .then(function(r) { return r.json(); })
      .then(function(rows) {
        var row = Array.isArray(rows) ? rows[0] : rows;
        if (row && row.email) {
          launchApp(email, row.role || '');
        } else {
          setLoading(false);
          showError('Access denied. ' + email + ' is not authorized.');
          sb.auth.signOut();
        }
      })
      .catch(function(err) {
        setLoading(false);
        showError('Connection error: ' + err.message);
      });
    }

    // Track if app has been launched to prevent double-launch
    var appLaunched = false;

    function safeLaunch(email, role) {
      if (appLaunched) return;
      appLaunched = true;
      launchApp(email, role);
    }

    // Check if this is an OAuth callback (has access_token in hash)
    var isOAuthCallback = window.location.hash.includes('access_token');

    // PRIORITY 1: Check cached session FIRST (instant restore)
    console.log('[CreatorHub] v4 loaded, isOAuthCallback:', isOAuthCallback);
    if (!isOAuthCallback) {
      var cached = sessionStorage.getItem(SESSION_KEY);
      console.log('[CreatorHub] cached session:', cached);
      if (cached) {
        try {
          var c = JSON.parse(cached);
          console.log('[CreatorHub] parsed cache:', c);
          if (c.email) {
            console.log('[CreatorHub] calling safeLaunch from cache');
            safeLaunch(c.email, c.role || '');
          }
        } catch(e) { console.error('[CreatorHub] cache parse error:', e); }
      }
    }

    // PRIORITY 2: Handle OAuth callback from Supabase
    sb.auth.onAuthStateChange(function(event, session) {
      if (appLaunched) return; // Already launched from cache
      if (event === 'SIGNED_OUT') return;
      if (session && session.user && session.user.email) {
        // Clear hash to prevent re-processing on refresh
        if (window.location.hash) history.replaceState(null, '', window.location.pathname);
        verifyAndLaunch(session.user.email);
      }
    });

    // Sign in button
    document.getElementById('signin-btn').addEventListener('click', function() {
      if (this.disabled) return;
      hideError();
      setLoading(true);
      sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: REDIRECT, queryParams: { hd: 'saadaa.in' } }
      }).then(function(r) {
        if (r.error) { setLoading(false); showError('OAuth error: ' + r.error.message); }
      });
    });

    // Listen for logout message from iframe
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'logout') {
        sessionStorage.removeItem(SESSION_KEY);
        sb.auth.signOut();
        document.getElementById('gas-frame').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        appLaunched = false;
      }
    });
  </script>
</body>
</html>
